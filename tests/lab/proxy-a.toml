# proxy-a: one of two identically configured lab proxies. The proxy never promotes:
# the lab driver promotes pg-b with pg_promote(), and [topology] provider = "postgres"
# follows whichever node is not in recovery, without a proxy.toml edit.
listen_address = "127.0.0.1:35710"
admin_address = "127.0.0.1:35790"
admin_token = "helios-lab-admin"
tr_enabled = true
tr_mode = "transaction"
write_timeout_secs = 30
strict_config = true

[health]
check_interval_secs = 1
check_timeout_secs = 2
failure_threshold = 2
success_threshold = 1

[topology]
provider = "postgres"
user = "lab"
database = "lab"
poll_interval_secs = 1
lease_timeout_secs = 5

[[nodes]]
host = "127.0.0.1"
port = 35701
role = "primary"

[[nodes]]
host = "127.0.0.1"
port = 35702
role = "standby"

[[nodes]]
host = "127.0.0.1"
port = 35703
role = "standby"
