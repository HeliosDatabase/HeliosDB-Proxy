# proxy-a for the reconnect-wave drill (H-05): proxy-a.toml plus per-node backend
# caps, a per-node reconnect limit and per-tenant client caps. Three tenants, named
# by application_name, share it: "big" (many writing clients), "small" (a few
# readers) and "heavy" (large transactions against its request budgets,
# ac858d61400b). pg-a is killed under load and pg-b promoted.
listen_address = "127.0.0.1:27710"
admin_address = "127.0.0.1:27790"
admin_token = "helios-lab-admin"
tr_enabled = true
tr_mode = "transaction"
write_timeout_secs = 30
strict_config = true

[limits]
max_concurrent_reconnects_per_node = 4
backend_slot_wait_ms = 10000

# A small committed-history ring fills within seconds, so the proxy's RSS
# reaches its steady state before pg-a is killed and the drill sees what the
# failover itself costs.
[journal]
max_committed_transactions = 2000

[multi_tenancy]
enabled = true
identify_by = "application_name"
tenants = ["big", "small", "heavy"]
max_clients_per_tenant = 64
tenant_max_clients = { small = 8, heavy = 8 }
# ac858d61400b: "heavy" runs transactions of four 64 KiB statements, at most two
# at once, with 300000 bytes of replay history across its sessions: one
# transaction (~262 kB) fits, any overlap with another's statement does not.
tenant_max_active_queries = { heavy = 2 }
active_query_wait_ms = 10000
tenant_max_replay_bytes = { heavy = 300000 }

[health]
check_interval_secs = 1
check_timeout_secs = 2
failure_threshold = 2
success_threshold = 1

[topology]
provider = "postgres"
user = "lab"
database = "lab"
poll_interval_secs = 1
lease_timeout_secs = 5

[[nodes]]
host = "127.0.0.1"
port = 27701
role = "primary"
max_connections = 70

[[nodes]]
host = "127.0.0.1"
port = 27702
role = "standby"
max_connections = 70

[[nodes]]
host = "127.0.0.1"
port = 27703
role = "standby"
max_connections = 70
