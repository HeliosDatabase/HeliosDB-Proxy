# =============================================================================
# HeliosProxy - Full Reference Configuration
# =============================================================================
#
# This file documents EVERY configurable option in HeliosProxy. It is intended
# as a reference, not a drop-in config. Most advanced sections are commented
# out; uncomment only what you need.
#
# Environment variable substitution: ${VAR:-default}
# Duration fields accept integer seconds unless noted otherwise.
#
# A prior draft of this file also carried a `[routing]`, `[lag]`, `[rewriter]`,
# `[graphql]`, JWT/OAuth/LDAP `[auth.*]` sub-tables, `[cache.l1]`/`[cache.l2]`/
# `[cache.l3]`/`[cache.invalidation]`, `[distribcache]`, `[ha]`, `[logging]`,
# and `[metrics]` sections. None of those ever matched `ProxyConfig`
# (src/config.rs) — TOML silently ignores unknown sections, so they loaded but
# did nothing — and they have been removed here. The real sections with
# similar intent are `[routing_hints]`, `[lag_routing]`, `[query_rewrite]`,
# `[graphql_gateway]`, and the two-key `[auth]` below; see CLAUDE.md's
# Interfaces list for the full, current set of sections `ProxyConfig` parses.

# =============================================================================
# PROXY — Core listener settings
# =============================================================================

listen_address = "${HELIOS_PROXY_LISTEN:-0.0.0.0:6432}"
# Loopback-only by default. The admin API runs privileged operations; binding it
# to a non-loopback address requires admin_token (or admin_allow_insecure = true).
admin_address  = "${HELIOS_PROXY_ADMIN:-127.0.0.1:9090}"
# Opt-in strict configuration (D-05): fail startup when an enabled subsystem was
# not compiled in, or when an unknown top-level key is present.
# strict_config = false

# Transaction Replay (ships in the default build; no cargo feature needed).
#   tr_enabled — master switch: journal auto-commit writes for the operator-driven
#                replay engine (POST /api/replay, time-travel) AND allow in-session
#                failover recovery. false forces the effective mode to `none`.
#   tr_mode    — in-session failover: what a LIVE client session experiences when
#                its backend connection fails mid-request (write error/timeout,
#                read error, EOF, reset) or dies while idle. Always compiled in.
#
#   mode        | on a backend fault
#   ------------+-------------------------------------------------------------------
#   none        | ONE ErrorResponse (SQLSTATE 57P01 naming the failed node) +
#               | ReadyForQuery, then the client connection is closed.
#   session     | Connection kept open. Waits for a healthy primary (write_timeout_secs),
#   (default)   | reconnects, replays the session's SET/RESET statements (named prepared
#               | statements are re-prepared lazily). A statement that never reached the
#               | old backend and was issued outside an explicit transaction is re-run
#               | transparently. Anything else -> ONE error (57P01 not delivered inside
#               | a transaction / 08007 outcome unknown) and the transaction is aborted
#               | (ROLLBACK and retry); the session then continues on the new primary.
#   select      | session + an unknown-outcome READ (SELECT/SHOW/...; never a write) is
#               | re-executed transparently outside a transaction, but ONLY when every
#               | function it calls is a known side-effect-free built-in or is listed in
#               | tr_read_functions — a UDF, nextval, pg_notify, set_config, an advisory
#               | lock or a quoted-identifier call makes it opaque (08007, never re-run).
#               | A READ-ONLY explicit transaction is replayed from its BEGIN first.
#   transaction | select + an UNCOMMITTED explicit transaction is replayed from its
#               | BEGIN on the new primary and the in-flight statement is re-executed
#               | inside it. The replay is VERIFIED: each statement's responses were
#               | digested as the client saw them (within tr_max_observation_bytes) and
#               | the new backend's responses are digested the same way — divergence
#               | rolls the replay back and returns 40001 instead of continuing on rows
#               | the client never saw. A COMMIT whose outcome is unknown is NEVER
#               | retried (08007). Still opt-in: verification catches divergent results,
#               | it does not make now(), random() or a RETURNING serial reproduce.
#   Replay caps: [limits] tr_max_replay_statements / tr_max_replay_bytes (a
#   transaction over a cap degrades to `session` behaviour). A transaction that
#   contained a COPY, entered the failed state, had a statement transformed by
#   query-rewrite/multi-tenancy, ran at SERIALIZABLE/REPEATABLE READ (explicit,
#   SET TRANSACTION, or inherited from default_transaction_isolation), or produced a
#   response too large to digest (tr_max_observation_bytes) is never replayed.
#   SET restore is transactional: SETs inside a transaction apply only if it commits,
#   ROLLBACK TO discards those after the savepoint, RESET/RESET ALL/DISCARD ALL inside
#   a transaction are deferred to commit, variables are keyed by name, and exceeding
#   tr_max_session_set_statements distinct variables refuses the failover (08006)
#   instead of re-homing with incomplete state. Extended-protocol SETs (JDBC),
#   SQL-level PREPARE, temp tables and cursors are not restored.
#   One deadline: write_timeout_secs bounds the WHOLE recovery — primary wait,
#   connect/auth, SET restore and replay — not each phase separately. COPY in progress at the
#   fault -> 08006 and close, every mode.
#   Credentials: re-homing opens a FRESH backend connection. In pass-through
#   auth mode the proxy never holds the client's password, so only a trust
#   backend can be reached (a challenging one fails the recovery with 08006).
#   For SCRAM/MD5 backends set [auth] mode = "scram" with a plaintext auth_file
#   entry — the proxy then authenticates its own backend connections.
#   Metrics: tr_failovers_total, tr_statements_reexecuted_total,
#   tr_transactions_replayed_total, tr_replay_failures_total,
#   tr_unknown_outcome_errors_total (+ *_cap_exceeded_total) on /metrics.
tr_enabled = true
tr_mode    = "session"
# TR-03: which interrupted READS may be re-executed on an unknown outcome. The
# built-in policy allows only PostgreSQL's side-effect-free functions; a read that
# calls a user-defined function, nextval/setval, pg_notify, set_config, advisory
# locks or any other unlisted name is never run again (it may already have run).
# List your own provably pure functions to make reads calling them eligible.
# tr_read_functions = ["my_pure_udf", "tenant_scope"]

# Seconds to wait for a new primary during failover before returning an error.
write_timeout_secs = 30

# =============================================================================
# LIMITS — Operational safety bounds & timeouts (PG-wire data path)
# =============================================================================
# Every key below was previously a hardcoded constant in the proxy. The values
# shown are the built-in defaults, so leaving the whole [limits] block out (or
# omitting any single key) is byte-for-byte identical to the historical
# behaviour. Every value MUST be > 0 — a 0 disables a safety bound rather than
# meaning "unbounded", so the proxy refuses to start with any 0 here. Timeouts
# are whole seconds; counts/bytes are plain integers. The two OPT-IN keys at the
# end of the block (max_client_connections, client_idle_timeout_secs) are the
# exception: there 0 is the default and means "off".
#
# [limits]
# # Capacity of the query-cancellation key map (BackendKeyData -> backend addr).
# # At capacity the oldest entries are FIFO-evicted (a dropped entry only means
# # one best-effort CancelRequest is not forwarded).
# max_cancel_keys = 100000
# # Deadline for the pre-auth startup exchange (client TLS + PG startup/auth).
# # Bounds slow-loris handshakes; the query loop itself is never bounded.
# startup_timeout_secs = 30
# # Timeout for a single backend write on the forward path (a hung/blackholed
# # backend must never pin a client task indefinitely).
# backend_write_timeout_secs = 30
# # Timeout for a single backend read on the relay path (a backend that accepts
# # the query but then emits no bytes must not pin a client task forever).
# backend_read_timeout_secs = 30
# # Timeout for a single client write (a wedged/slow client must not pin a proxy
# # task and the backend connection it holds).
# client_write_timeout_secs = 60
# # Timeout for the out-of-band re-prepare exchange (Parse+Flush -> ParseComplete)
# # performed when a session moves to a different backend connection.
# reprepare_timeout_secs = 15
# # Per-session cap on distinct named prepared statements.
# max_prepared_statements = 8192
# # Per-session cap on aggregate bytes retained in the prepared-statement
# # registry (each entry holds the full encoded Parse). 64 MiB.
# max_prepared_bytes = 67108864
# # Per-session cap on the un-flushed extended-protocol buffer: a client must
# # reach a Sync/Flush boundary before this many bytes pile up. 64 MiB.
# max_pending_bytes = 67108864
# Upper bound on ONE backend response frame's declared length on every streaming
# relay (query responses, cache capture, replay drain, pool reset, idle backend
# watch). A frame header above this, or below the 4-byte protocol minimum, closes
# the backend connection as malformed instead of buffering toward the advertised
# size. Bounds a single frame, not a result set. Default 100 MiB = the frontend
# message cap.
# max_backend_frame_bytes = 104857600
# Whole-response deadline for one backend response on the streaming relays (from
# first byte to ReadyForQuery). backend_read_timeout_secs re-arms per read, so it
# cannot catch a backend dripping bytes inside one response; this can. 0 = off.
# backend_response_timeout_secs = 0
# # Global ceiling on idle connections parked in the data-path backend pool
# # across ALL (node,user,db) identities (pool-modes feature only).
# max_total_idle_backend_conns = 8192
# # How often the idle-connection reaper runs.
# pool_reap_interval_secs = 30
# # Ceiling on concurrently-served client connections on the PG-wire listener.
# # 0 (default) = unlimited, exactly as before this key existed. When > 0, a
# # connection that arrives with no free slot is answered with a PostgreSQL
# # ErrorResponse (FATAL, SQLSTATE 53300, "sorry, too many clients already")
# # and closed instead of being queued — the shape a PostgreSQL server at
# # max_connections gives. The slot is taken only once the connection's first
# # startup message is known to be a real Startup, so a CancelRequest (query
# # cancellation) is always served, even at the cap, and never consumes a slot.
# # Rejections are counted by the `connections_rejected` metric
# # (/metrics, /metrics/prometheus). READ ONCE AT STARTUP: a SIGHUP that
# # changes this key is logged and ignored — restart to change the cap.
# max_client_connections = 0
# # Idle-session timeout for an authenticated client: how long a session may sit
# # between statements before the proxy terminates it with SQLSTATE 57P05
# # ("terminating connection due to idle-session timeout"). 0 (default) =
# # disabled, exactly as before this key existed. Follows PostgreSQL's
# # idle_session_timeout semantics — it applies only to a session waiting for a
# # NEW command. The clock measures time since the client's last statement, and
# # unsolicited backend traffic relayed to an idle client (LISTEN/NOTIFY,
# # NoticeResponse, ParameterStatus) is not client activity and does not reset
# # it. It is NOT armed while a message is only partially received, nor during a
# # COPY FROM STDIN (a paused bulk load is never killed by it). PostgreSQL's
# # separate idle_in_transaction_session_timeout is NOT implemented: a session
# # left idle inside an open transaction is terminated by this timeout too. Read
# # once at startup.
# client_idle_timeout_secs = 0
# # Bounded fair-admission queue (H-05): when max_client_connections is reached,
# # a new connection waits up to this many seconds for a permit (FIFO) before
# # being refused with 53300. 0 (default) refuses immediately. Read once at
# # startup.
# client_admission_wait_secs = 0
# # Idle authenticated backend connections kept per identity by each
# # non-PG-wire gateway (HTTP SQL, MCP, GraphQL) for reuse (H-06). 0 disables
# # pooling (each request dials). Gateways pool separately.
# gateway_pool_max_idle = 16
# # In-session Transaction Replay (tr_mode = select | transaction): caps on the
# # statements / bytes recorded per explicit transaction for replay after a
# # failover. Over a cap the transaction is marked non-replayable (transaction
# # mode degrades to session behaviour for it; tr_replay_cap_exceeded_total).
# tr_max_replay_statements = 1000
# tr_max_replay_bytes = 4194304
# # In-session Transaction Replay (tr_mode != none): cap on tracked session
# # SET/RESET statements replayed onto the replacement backend. Over the cap,
# # tracking stops (tr_session_set_cap_exceeded_total) and the restore is partial.
# tr_max_observation_bytes = 1048576   # response bytes hashed per recorded statement; replay verifies the digest (40001 on divergence)
# tr_max_session_set_statements = 256   # distinct session variables tracked for restore;
#                                        # over the cap a failover is refused (08006)
# # Operator time-window replay (POST /api/replay): overall wall-clock deadline.
# # query_timeout bounds each statement; this bounds the whole run. On expiry the
# # replay stops cleanly and reports deadline_exceeded + partial progress. 0 = off.
# replay_deadline_secs = 300

# =============================================================================
# POOL — Backend connection pool (proxy -> database)
# =============================================================================

[pool]
min_connections    = 5
max_connections    = 100
idle_timeout_secs  = 300
max_lifetime_secs  = 1800
acquire_timeout_secs = 5
# Validate a pooled connection before handing it out; false skips
# acquire-time validation entirely. Today that validation is a lightweight
# state check (not a live socket probe) for every shipped deployment, since
# the pool never attaches a real backend socket to its connections outside
# of unit tests. The data-path liveness check operators actually rely on is
# the idle backend pool's periodic stale-connection probe
# (pool_reap_interval_secs, above).
test_on_acquire    = true

# =============================================================================
# POOL_MODE — Pooling strategy
# =============================================================================

[pool_mode]
# session | transaction | statement
mode = "${HELIOS_PROXY_POOL_MODE:-transaction}"

max_pool_size        = 100    # Max connections per node
min_idle             = 10     # Warm connections to keep ready
idle_timeout_secs    = 600    # Seconds before closing idle connections
max_lifetime_secs    = 3600   # Max age of a connection before recycling
acquire_timeout_secs = 5      # Timeout to acquire a connection from pool

# SQL to reset session state when returning connection to pool.
reset_query = "DISCARD ALL"

# Prepared statement handling:
#   disable — never use prepared statements
#   track   — proxy transparently re-creates them on new connections
#   named   — protocol-level named statements (session mode only)
prepared_statement_mode = "track"

# Validation query executed on acquire when test_on_acquire is true.
validation_query = "SELECT 1"

# How long clients wait in the queue when pool is exhausted (seconds).
# queue_timeout_secs = 30

# Maximum pending client requests when pool is full (0 = unlimited).
# max_queue_size = 0

# =============================================================================
# LOAD BALANCER — Read/write routing strategy
# =============================================================================

[load_balancer]
# round_robin | weighted_round_robin | least_connections | latency_based | random
read_strategy    = "round_robin"
read_write_split = true

# Nodes exceeding this average latency (ms) are deprioritised.
latency_threshold_ms = 100

# =============================================================================
# TOPOLOGY — authoritative primary tracking (H-01)
# =============================================================================
# static (default): configured roles + the health checker decide the primary.
# postgres: poll pg_is_in_recovery() on every configured node (requires the
# `postgres-topology` cargo feature) and make that answer authoritative for
# writes. A promotion then moves the write destination without editing roles,
# and a missing provider answer waits (fail closed) instead of writing to a
# stale primary.
[topology]
provider           = "static"   # static | postgres
poll_interval_secs = 2          # >= 1
lease_timeout_secs = 10         # >= 1: authority expires this long after the
                                # last successful provider observation (H-02)
user               = "postgres" # credentials for the provider's probes
# password         = "${HELIOS_PROXY_TOPOLOGY_PASSWORD}"
database           = "postgres"

# =============================================================================
# HEALTH — Backend health checks
# =============================================================================

[health]
# Keep check_timeout_secs < check_interval_secs. If a probe can still be running
# when the next tick fires, that tick is skipped for the node (counted as
# health_probe_skipped_inflight) instead of stacking a second probe, so
# detection is coarser than check_interval_secs suggests. A config where
# check_timeout_secs >= check_interval_secs still loads, but logs a warning.
check_interval_secs = 5
check_timeout_secs  = 3
failure_threshold   = 3     # Failures before marking unhealthy
success_threshold   = 2     # Successes before marking healthy again
check_query         = "SELECT 1"
# Optional credentials for the daemon's health and WAL-lag probes (H-03/H-04).
# When unset, the daemon uses a credential-less PostgreSQL protocol probe
# (SSLRequest); check_query and lag measurement then stay unused/unknown.
# user     = "postgres"
# password = "${HELIOS_PROXY_HEALTH_PASSWORD}"
# database = "postgres"

# =============================================================================
# LAG-AWARE ROUTING — replica freshness (feature `lag-routing`)
# =============================================================================
# [lag_routing]
# enabled = true
# ryw_window_ms = 500          # reads within this window after a session write
#                              # pin to the primary (read-your-writes)
# max_lag_bytes = 16777216     # exclude a standby lagging beyond this (0 = off)
# require_known_lag = false    # true = exclude standbys whose lag is unknown
#                              # (never measured) instead of treating them as fresh

# =============================================================================
# NODES — Backend database cluster members
# =============================================================================

[[nodes]]
host    = "${HELIOS_PROXY_PRIMARY_HOST:-db-primary}"
port    = 5432
http_port = 8080              # HTTP API port (HeliosDB SQL API forwarding)
role    = "primary"           # primary | standby | replica
weight  = 100                 # Weight for weighted_round_robin
enabled = true
# name  = "primary-us-east"  # Optional display name for logs

[[nodes]]
host    = "${HELIOS_PROXY_STANDBY1_HOST:-db-standby1}"
port    = 5432
http_port = 8080
role    = "standby"
weight  = 100
enabled = true
# name  = "standby-us-east-1"

# [[nodes]]
# host    = "${HELIOS_PROXY_STANDBY2_HOST:-db-standby2}"
# port    = 5432
# role    = "standby"
# weight  = 50
# enabled = true

# =============================================================================
# TLS — Client-facing TLS termination
# =============================================================================

# [tls]
# enabled             = true
# cert_path           = "/etc/heliosproxy/tls/server.crt"
# key_path            = "/etc/heliosproxy/tls/server.key"
# ca_path             = "/etc/heliosproxy/tls/ca.crt"  # For client cert verification
# require_client_cert = false

# =============================================================================
# CACHE — Multi-tier query result cache (DistribCache)
# =============================================================================

[cache]
# Unquoted so `${VAR:-default}` expands to a bare TOML boolean (a quoted
# "${...}" would deserialize as a string and fail the bool field).
enabled = ${HELIOS_PROXY_CACHE_ENABLED:-true}

# Hard ceiling, in bytes, on the backend response the proxy will buffer in
# memory while streaming a cacheable read to the client. The capture is a
# per-session transient held ON TOP of the bytes already forwarded, so an
# unbounded one let a single `SELECT * FROM big_table` pin a whole result set
# per concurrent session. Past this bound the capture buffer is dropped and the
# response is simply not cached — the client still receives every byte,
# unchanged.
#
# DELIBERATELY SHARED by both response caches: the data path captures a
# response exactly once and hands the same buffer to the query-result cache
# and/or the edge cache, so this one key bounds the capture for both. It
# therefore applies even when `enabled = false` here, as long as `[edge]` is
# caching reads — and the edge cache also refuses any single entry larger than
# it (`[edge] max_entries` bounds the entry COUNT only).
#
# Default 4 MiB (must be > 0). Kept above the 1 MiB `max_result_bytes` default
# so it never masks that knob. Watch `heliosdb_proxy_cache_capture_oversize_total`
# on /metrics/prometheus (and `oversize_rejected` in the edge cache stats) to
# see how often reads bypass the caches on size grounds.
max_cacheable_response_bytes = 4194304

# =============================================================================
# RATE LIMIT — Query rate and concurrency limiting
# =============================================================================

# [rate_limit]
# enabled             = true
# default_qps         = 1000          # Default queries per second per key
# default_burst       = 2000          # Token bucket burst capacity
# default_concurrency = 100           # Max concurrent queries per key
#
# # Action when limit exceeded: reject | warn | queue(5s) | throttle(100ms)
# exceeded_action     = "reject"
# retry_after         = true          # Include Retry-After header in errors
#
# # Limit scopes
# user_limits_enabled      = true
# database_limits_enabled  = true
# client_ip_limits_enabled = true
# pattern_limits_enabled   = false    # Per-query-pattern limiting
#
# # Overflow queue settings
# queue_max_wait_secs = 5
# queue_size          = 1000
#
# # Throttle writes when replication lag exceeds this threshold.
# replication_throttle_threshold_secs = 5
#
# # Cost-based estimation (weight expensive queries higher).
# cost_estimation_enabled = true
#
# # Priority multipliers — higher-priority callers get proportionally more QPS.
# [rate_limit.priority]
# low      = 0.5
# normal   = 1.0
# high     = 2.0
# critical = 10.0

# =============================================================================
# CIRCUIT BREAKER — Per-node failure detection and recovery
# =============================================================================

# [circuit_breaker]
# failure_threshold          = 5     # Failures in window to trip breaker
# failure_window_secs        = 30    # Sliding failure window
# cooldown_secs              = 10    # Time in open state before half-open probe
# half_open_success_threshold = 3    # Successes in half-open to close breaker
# half_open_max_probes       = 2     # Concurrent probes in half-open
# adaptive_enabled           = false # Adaptive thresholds based on history
#
# # Failure conditions
# [circuit_breaker.failure_conditions]
# timeout_secs           = 5
# slow_threshold_secs    = 2        # Slow responses count as failures
# ignore_transient       = true     # Ignore retryable errors
# count_connection_errors = true
# count_timeouts         = true
# error_codes            = [
#     "08001", "08004", "08006",    # Connection failures
#     "57P01", "57P02", "57P03",    # Server shutdown / crash
#     "XX000", "XX001", "XX002",    # Internal / corruption
# ]
#
# # Sync mode-specific thresholds (tighter for sync standbys).
# [circuit_breaker.sync_modes]
# sync_threshold     = 3
# sync_cooldown_secs = 5
# semisync_threshold     = 5
# semisync_cooldown_secs = 10
# async_threshold        = 10
# async_cooldown_secs    = 30

# =============================================================================
# ANALYTICS — Query analytics, slow query log, and pattern detection
# =============================================================================

# These are the keys the proxy.toml parser (`AnalyticsToml` in src/config.rs)
# actually recognises; each line shows its DEFAULT. The `[analytics.*]`
# sub-tables further down document the library defaults and are IGNORED by
# proxy.toml.
# [analytics]
# enabled                = false     # Record per-query stats / slow log / patterns
# slow_query_ms          = 1000      # Queries slower than this hit the slow log
# max_fingerprints       = 10000     # Unique query shapes to track
# # Bounded queue between the connection tasks and the single background
# # analytics consumer. Fingerprinting, statistics, the slow-query log, pattern
# # detection and cost attribution all run on that consumer, so a query only
# # pays a non-blocking try_send. An execution arriving when the queue is full
# # is DROPPED — never blocks the relay — and counted as
# # `analytics_dropped_total` in GET /api/analytics. Must be >= 1. Raise it if
# # that counter climbs. Because ingest is asynchronous, /api/analytics can lag
# # the newest query by the queue drain time (microseconds in practice).
# queue_capacity         = 8192
# # Bound on the memoized raw-SQL -> fingerprint cache: a repeated statement
# # skips all six regex normalization passes. Set to 0 to disable memoization.
# fingerprint_cache_size = 10000
# # Largest statement (bytes) allowed into that memo. The memo key is the raw
# # SQL, so this is what bounds it in BYTES and not just in entries: with the
# # defaults it retains at most 10000 * 4096 = ~40 MiB of SQL. A longer
# # statement (bulk INSERT with inline VALUES, generated DDL) is still
# # fingerprinted, it is simply never cached. Must be >= 1; use
# # fingerprint_cache_size = 0 to turn memoization off.
# fingerprint_cache_max_sql_bytes = 4096
#
# # Slow query log
# [analytics.slow_query]
# enabled             = true
# threshold_ms        = 1000         # Queries slower than this are logged
# log_parameters      = false
# max_query_length    = 4096
# max_recent_entries  = 1000
# # log_file           = "/var/log/heliosproxy/slow.log"
#
# # Anti-pattern detection
# [analytics.patterns]
# n_plus_one_detection  = true
# n_plus_one_threshold  = 5          # Min repeated similar queries per session
# burst_detection       = true
# burst_threshold       = 50         # Queries in burst window
# burst_window_ms       = 100
# session_history_size  = 100
# session_timeout_secs  = 300
# max_sessions          = 10000
#
# # Sampling (reduce overhead on high-QPS systems)
# [analytics.sampling]
# enabled             = false
# rate                = 1.0          # 0.0 - 1.0 (1.0 = sample everything)
# always_sample_slow  = true
# always_sample_errors = true
#
# # Alerting
# [analytics.alerts]
# slow_query_threshold_secs = 5
# error_rate_threshold      = 0.05   # 5% error rate triggers alert
# alert_on_n_plus_one       = true
# alert_on_burst            = true
# # webhook_url             = "https://hooks.slack.com/services/..."

# =============================================================================
# ANOMALY DETECTION — in-process statistical + heuristic detector tunables
# =============================================================================
# Only consumed when the binary is built with the `anomaly-detection` feature.
# The section is parsed on every build so configs round-trip. Every key below
# shows its DEFAULT — omit the section entirely to keep the historical
# hardcoded behaviour unchanged.
# NOTE: the detector is built once at startup; changing [anomaly] requires a
# restart (SIGHUP live-reload does not rebuild it).
# [anomaly]
# rate_window_secs       = 60        # Rolling window for the per-tenant rate EWMA (>= 1)
# spike_z_threshold      = 3.0       # Min z-score before a rate spike fires (finite, > 0)
# auth_window_secs       = 60        # Failed-auth burst window, seconds (>= 1)
# auth_critical_count    = 10        # Failures in the window -> Critical
# auth_warning_count     = 5         # Failures in the window -> Warning (<= auth_critical_count)
# event_buffer_size      = 1024      # Max events kept in the in-memory ring buffer (>= 1)
# emit_novel_queries     = true      # Emit first-seen query fingerprints as info events
# max_seen_fingerprints  = 100000    # Cap on the novel-query fingerprint set before reset (>= 1)

# =============================================================================
# MULTI-TENANCY — Tenant isolation and per-tenant resource limits
# =============================================================================

# [multi_tenancy]
# enabled               = false
# allow_unknown_tenants = false
# auto_create_tenants   = false
# max_tenants           = 1000
# cross_tenant_analytics = false
# # admin_user_pattern   = "admin@*"
#
# # How to identify which tenant a request belongs to:
# #   header        — read from HTTP header (X-Tenant-Id)
# #   username_prefix — parse "tenant.user" usernames (separator = '.')
# #   jwt_claim     — extract from JWT token claim
# #   database_name — map database name to tenant
# #   sql_context   — SET helios.tenant_id = '...'
# [multi_tenancy.identification]
# method      = "header"
# header_name = "X-Tenant-Id"
# # separator = "."            # For username_prefix method
# # claim_name = "tenant_id"   # For jwt_claim method
#
# # Example tenant definition:
# # [[multi_tenancy.tenants]]
# # id         = "acme"
# # name       = "Acme Corp"
# # isolation  = "schema"       # database | schema | row | branch
# # database   = "shared_db"
# # schema     = "acme"
# # max_connections = 50
# # qps_limit  = 1000
# # read_only  = false
# # allow_ddl  = false

# =============================================================================
# AUTH — Client authentication
# =============================================================================
# Only two keys exist (`AuthConfig` in src/config.rs). `passthrough` (default)
# relays the client's auth exchange straight to the backend, so the proxy
# never holds a password. `scram` makes the proxy terminate SCRAM-SHA-256
# itself against `auth_file`, becoming the auth boundary — required for
# pooling client credentials across pooled backend connections, and for
# Transaction Replay recovery against a backend that challenges (a trust
# backend is otherwise the only kind failover can re-authenticate to).

# [auth]
# mode      = "scram"                      # passthrough (default) | scram
# auth_file = "/etc/heliosproxy/users.txt"  # "user:secret" per line; secret is
#                                           # plaintext or "SCRAM-SHA-256$..."

# =============================================================================
# PLUGINS — WASM plugin runtime
# =============================================================================

# [plugins]
# enabled       = false
# plugin_dir    = "/etc/heliosproxy/plugins"   # scanned for *.wasm at startup
# hot_reload    = false                        # watch plugin_dir and reload changed plugins
# memory_limit_mb = 64                         # memory per plugin instance, MB
# timeout_ms    = 100                          # execution timeout per hook call
# max_plugins   = 20
# fuel_metering = true                         # bound CPU per call
# fuel_limit    = 1000000
# # trust_root  = "/etc/heliosproxy/trust"     # Ed25519 *.pub dir: every .wasm then needs a verifying .sig
# kv_max_value_bytes     = 65536       # Max bytes per plugin-KV key OR value (kv_set / PUT /admin/kv); 0 = unlimited
# kv_max_keys_per_plugin = 1024        # Max distinct keys per plugin KV namespace; 0 = unlimited
# kv_max_plugins         = 256         # Max distinct plugin KV namespaces (bounds PUT /admin/kv namespace growth); 0 = unlimited
# kv_max_total_bytes     = 67108864    # Max TOTAL retained bytes across ALL plugin KV namespaces (key+value+namespace-name); OOM backstop; 0 = unlimited
# # Per-plugin settings are pushed at runtime through PUT /admin/kv/<plugin>/<key>;
# # there are no [plugins.<name>] tables.

