# Two known tenants in one database, identified by a startup parameter.
# Build with --features multi-tenancy (or all-features).
# Applications must authenticate tenant identity before allowing this parameter.
strict_config = true
listen_address = "127.0.0.1:6432"
admin_address = "127.0.0.1:9090"
tr_enabled = true
tr_mode = "session"

[pool_mode]
mode = "transaction"

[[nodes]]
host = "127.0.0.1"
port = 5432
role = "primary"

[multi_tenancy]
enabled = true
identify_by = "application_name"
tenants = ["acme", "widgetco"]
tenant_column = "tenant_id"
tenant_tables = ["orders", "products"]
unknown_tenant = "refuse"
max_clients_per_tenant = 20
max_active_queries_per_tenant = 4
active_query_wait_ms = 5000
idle_permit_timeout_ms = 60000
max_replay_bytes_per_tenant = 8388608
max_journal_bytes_per_tenant = 67108864

[multi_tenancy.tenant_max_clients]
acme = 50

[multi_tenancy.tenant_max_active_queries]
acme = 8

[multi_tenancy.tenant_max_journal_bytes]
acme = 134217728
